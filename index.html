<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kuis Tebak Gambar - Dapat Poin</title>

  <!-- ===================================================== -->
  <!-- MONETAG REWARDED INTERSTITIAL TAG                     -->
  <!-- Ganti XXXXXX dengan zone ID kamu dari dashboard       -->
  <!-- Ganti domain.com dengan domain script dari Monetag    -->
  <!-- ===================================================== -->
  <script
    src="https://domain.com/vignette.min.js"
    data-zone="XXXXXX"
    data-sdk="show_XXXXXX">
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .app {
      background: #1e293b;
      border-radius: 20px;
      padding: 28px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .header h1 { font-size: 1.1rem; font-weight: 600; }
    .coin-badge {
      background: #facc15;
      color: #1e293b;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.9rem;
    }

    /* --- Game area --- */
    .question-img {
      background: #334155;
      border-radius: 14px;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      margin-bottom: 20px;
    }
    .question-text {
      font-size: 1rem;
      margin-bottom: 16px;
      font-weight: 500;
    }
    .options { display: grid; gap: 10px; margin-bottom: 20px; }
    .option-btn {
      background: #334155;
      border: 2px solid transparent;
      color: #e2e8f0;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.95rem;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s;
    }
    .option-btn:hover { background: #475569; }
    .option-btn.correct { background: #16a34a; border-color: #22c55e; }
    .option-btn.wrong { background: #dc2626; border-color: #ef4444; }
    .option-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .feedback {
      font-size: 0.9rem;
      margin-bottom: 16px;
      min-height: 20px;
    }
    .feedback.ok { color: #4ade80; }
    .feedback.no { color: #f87171; }

    /* --- Ad button --- */
    .ad-section {
      border-top: 1px solid #334155;
      padding-top: 18px;
      margin-top: 18px;
    }
    .ad-btn {
      width: 100%;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      border: none;
      color: #fff;
      padding: 14px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .ad-btn:hover { opacity: 0.9; }
    .ad-btn:disabled {
      background: #475569;
      cursor: not-allowed;
      opacity: 0.7;
    }
    .ad-note {
      font-size: 0.78rem;
      color: #94a3b8;
      text-align: center;
      margin-top: 8px;
    }

    /* --- Toast --- */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #22c55e;
      color: #fff;
      padding: 12px 24px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.9rem;
      opacity: 0;
      transition: all 0.3s;
      pointer-events: none;
      z-index: 10000;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1>🧠 Kuis Tebak Gambar</h1>
    <div class="coin-badge">⭐ <span id="coinCount">0</span></div>
  </div>

  <div class="question-img" id="questionImg">❓</div>
  <div class="question-text" id="questionText">Memuat soal...</div>
  <div class="options" id="optionsContainer"></div>
  <div class="feedback" id="feedback"></div>

  <div class="ad-section">
    <button class="ad-btn" id="watchAdBtn" disabled>
      🎬 Tonton Iklan → +50 ⭐
    </button>
    <p class="ad-note">Tonton iklan sampai selesai untuk dapat bonus poin</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =====================================================
   1. DATA SOAL
   ===================================================== */
const QUESTIONS = [
  {
    emoji: "🍎",
    question: "Buah apa yang identik dengan warna merah dan sering jadi ikon kesehatan?",
    options: ["Jeruk", "Apel", "Mangga", "Pisang"],
    correct: 1
  },
  {
    emoji: "🐘",
    question: "Hewan apa yang punya belalai panjang dan telinga lebar?",
    options: ["Kucing", "Gajah", "Kuda", "Sapi"],
    correct: 1
  },
  {
    emoji: "🌍",
    question: "Planet apa yang kita tinggali sekarang?",
    options: ["Mars", "Venus", "Bumi", "Jupiter"],
    correct: 2
  },
  {
    emoji: "📱",
    question: "Alat apa yang biasa dipakai untuk menelepon dan mengirim pesan?",
    options: ["Televisi", "Radio", "Handphone", "Kulkas"],
    correct: 2
  },
  {
    emoji: "☀️",
    question: "Benda langit apa yang terbit di pagi hari?",
    options: ["Bulan", "Bintang", "Matahari", "Awan"],
    correct: 2
  }
];

/* =====================================================
   2. STATE
   ===================================================== */
let currentIndex = 0;
let coins = parseInt(localStorage.getItem("quiz_coins") || "0", 10);
let answered = false;
let adReady = false;
let showAdFunction = null; // akan diisi oleh Monetag

const coinCountEl = document.getElementById("coinCount");
const questionImgEl = document.getElementById("questionImg");
const questionTextEl = document.getElementById("questionText");
const optionsContainer = document.getElementById("optionsContainer");
const feedbackEl = document.getElementById("feedback");
const watchAdBtn = document.getElementById("watchAdBtn");
const toastEl = document.getElementById("toast");

/* =====================================================
   3. UTIL
   ===================================================== */
function updateCoinDisplay() {
  coinCountEl.textContent = coins;
  localStorage.setItem("quiz_coins", coins);
}

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  setTimeout(() => toastEl.classList.remove("show"), 2200);
}

/* =====================================================
   4. GAME LOGIC
   ===================================================== */
function loadQuestion() {
  if (currentIndex >= QUESTIONS.length) {
    questionImgEl.textContent = "🎉";
    questionTextEl.textContent = "Semua soal sudah dijawab! Tonton iklan untuk bonus poin.";
    optionsContainer.innerHTML = "";
    feedbackEl.textContent = "";
    watchAdBtn.disabled = !adReady;
    return;
  }

  const q = QUESTIONS[currentIndex];
  answered = false;
  questionImgEl.textContent = q.emoji;
  questionTextEl.textContent = q.question;
  feedbackEl.textContent = "";
  feedbackEl.className = "feedback";

  optionsContainer.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.textContent = opt;
    btn.addEventListener("click", () => handleAnswer(i, btn));
    optionsContainer.appendChild(btn);
  });

  watchAdBtn.disabled = !adReady;
}

function handleAnswer(selectedIndex, btnEl) {
  if (answered) return;
  answered = true;

  const q = QUESTIONS[currentIndex];
  const allBtns = optionsContainer.querySelectorAll(".option-btn");
  allBtns.forEach((b, i) => {
    b.disabled = true;
    if (i === q.correct) b.classList.add("correct");
  });

  if (selectedIndex === q.correct) {
    btnEl.classList.add("correct");
    feedbackEl.textContent = "✅ Benar! +10 poin";
    feedbackEl.className = "feedback ok";
    coins += 10;
    updateCoinDisplay();
  } else {
    btnEl.classList.add("wrong");
    feedbackEl.textContent = "❌ Salah. Jawaban benar: " + q.options[q.correct];
    feedbackEl.className = "feedback no";
  }

  currentIndex++;
  setTimeout(loadQuestion, 1400);
}

/* =====================================================
   5. MONETAG INTEGRATION
   ===================================================== */

// Tunggu hingga fungsi global dari Monetag tersedia
window.addEventListener("load", () => {
  const ZONE_ID = "XXXXXX"; // GANTI dengan zone ID kamu
  const sdkFuncName = "show_" + ZONE_ID;

  const checkSDK = setInterval(() => {
    if (typeof window[sdkFuncName] === "function") {
      clearInterval(checkSDK);
      showAdFunction = window[sdkFuncName];
      adReady = true;
      watchAdBtn.disabled = false;
      console.log("Monetag SDK ready ✅ | Fungsi:", sdkFuncName);
    }
  }, 300);

  // Timeout jika SDK tidak load dalam 10 detik
  setTimeout(() => {
    if (!adReady) {
      watchAdBtn.disabled = true;
      watchAdBtn.textContent = "⚠️ Iklan tidak tersedia";
      console.warn("Monetag SDK gagal load atau fungsi show_XXXXXX tidak ditemukan");
    }
  }, 10000);
});

// Tombol tonton iklan
watchAdBtn.addEventListener("click", async () => {
  if (!adReady || !showAdFunction) return;

  watchAdBtn.disabled = true;
  watchAdBtn.textContent = "⏳ Memuat iklan...";

  try {
    // Monetag: panggil fungsi global show_XXXXXX()
    // Fungsi ini mengembalikan Promise yang resolve setelah user menonton iklan
    await showAdFunction();

    // Promise resolve = user sudah menonton sampai selesai
    coins += 50;
    updateCoinDisplay();
    showToast("🎉 +50 poin! Terima kasih sudah menonton");

  } catch (err) {
    console.error("Monetag ad error:", err);
    showToast("Iklan belum tersedia, coba lagi nanti");

  } finally {
    // Reset tombol
    watchAdBtn.disabled = false;
    watchAdBtn.textContent = "🎬 Tonton Iklan → +50 ⭐";
  }
});

/* =====================================================
   6. INIT
   ===================================================== */
updateCoinDisplay();
loadQuestion();
</script>
</body>
</html>
